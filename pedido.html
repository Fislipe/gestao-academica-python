<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mazza's - Faça seu Pedido</title>
    <link rel="shortcut icon" href="imgs/icon.png.jpeg">
    <link rel="stylesheet" href="css/pedido.css">
</head>
<body>
    <header class="nav">
        <img class="navimg" src="imgs/mazza.png" alt="Logo">
        <ul class="navbar">
            <li class="navitem"><a class="navbt" href="index.html">Home</a></li>
            <li class="navitem"><a class="navbt" href="sobre.html">Sobre</a></li>
            <li class="navitem"><a class="navbt" href="cardapio.html">Cardápio</a></li>
        </ul>
    </header>

    <div class="pedido">
        <form class="pedidoform">
            <label id="labelname">
                <span class="inputxt">Seu nome:</span>
                <input type="text" id="nome" required>
            </label>

            <label id="labelfon">
                <span class="inputxt">Telefone (DDD-0000-0000):</span>
                <input type="tel" id="fone" pattern="[0-9]{2}-[0-9]{4}-[0-9]{4}" required>
            </label>

            <label id="labeladr">
                <span class="inputxt">Endereço de Entrega:</span>
                <input type="text" id="endereco" required>
            </label>

            <div id="pedidores"></div>

            <div class="buttons" id="buttons">
                <input type="button" onclick="maispizza()" value="+ Pizza" class="button">
                <input type="button" onclick="maisbebida()" value="+ Bebida" class="button">
                <input type="button" onclick="maisdoce()" value="+ Doce" class="button">
            </div>

            <input type="button" id="finish" value="Concluir Pedido" onclick="fim()">
        </form>
    </div>
    <script src="pedido.js"></script>
</body>
</html>
